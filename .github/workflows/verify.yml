name: Verificar CRM
on:
  push:
    branches: [main, phase-2-editor-stability, phase-5-editorial-homologation]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
      - name: Compilar Pages Functions
        run: pnpm exec wrangler pages functions build --outdir .wrangler/functions-check
      - name: Preparar testes locais de integração
        run: |
          pnpm exec playwright install --with-deps chromium
      - name: Testar fluxos críticos no navegador e D1 local
        run: pnpm test:e2e
